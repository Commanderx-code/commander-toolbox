name = "Security"

[[data]]
name = "FirewallD Firewall Baselines (CTT)"
description = "Configure FirewallD with CTT's recommended baseline rules for improved system security. For more information visit: https://christitus.com/linux-security-mistakes"
script = "firewalld-baselines.sh"
task_list = "I SS"

[[data.preconditions]]
matches = true
data = "command_exists"
values = [ "firewall-cmd" ]
[[data]]
name = "Lynis Security Audit"
description = "Install Lynis when needed, run an elevated system security audit with live results, then optionally remove Lynis."
script = "lynis-audit.sh"
task_list = "I MP RP"
multi_select = false

[[data]]
name = "UFW Firewall Baselines (CTT)"
description = "Developed to ease iptables firewall configuration, UFW provides a user friendly way to create an IPv4 or IPv6 host-based firewall. This command installs UFW and configures UFW based on CTT's recommended rules. For more information visit: https://christitus.com/linux-security-mistakes"
script = "ufw-baselines.sh"
task_list = "I SS"

[[data.preconditions]]
matches = false
data = "command_exists"
values = [ "firewall-cmd" ]

[[data]]
name = "AppArmor Setup and Status"
description = "Install AppArmor tools/profiles and enable its service on Arch or Debian/Ubuntu with an AppArmor-enabled kernel. Does not change boot arguments or replace SELinux."
script = "../commander/apparmor.sh"
task_list = "I MP SS"
multi_select = false

[[data.preconditions]]
matches = true
data = "file_exists"
values = ["/sys/module/apparmor/parameters/enabled"]

[[data.preconditions]]
matches = false
data = { containing_file = "/etc/os-release" }
values = ["ID=fedora"]

[[data]]
name = "Fedora SELinux Tools and Status"
description = "Install Fedora SELinux policy, management and diagnostic tools and show status. Preserves enforcement mode and existing local policy."
script = "../commander/selinux.sh"
task_list = "I MP"
multi_select = false

[[data.preconditions]]
matches = true
data = { containing_file = "/etc/os-release" }
values = ["ID=fedora"]
